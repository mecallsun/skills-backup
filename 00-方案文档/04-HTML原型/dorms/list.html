<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>宿舍档案 — 金戈宿舍管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../_shared/layout-tab.css">
</head>
<body>
    <!-- ========== Tier 1: 顶部品牌栏 (48px) ========== -->
    <div class="top-bar">
        <div class="d-flex justify-content-between align-items-center h-100">
            <div class="d-flex align-items-center">
                <i class="bi bi-droplet-half brand-icon"></i>
                <span class="brand-text">金戈宿舍管理系统</span>
                <span class="brand-version">v2.12.0</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="user-pill">
                    <i class="bi bi-person-circle"></i>
                    <span>管理员</span>
                </span>
                <a href="#" class="btn-exit" title="退出登录" aria-label="退出登录">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </a>
            </div>
        </div>
    </div>

    <!-- ========== Tier 3: Tab 页签栏 (40px) ========== -->
    <div id="tab-bar"></div>

    <!-- ========== Tier 4: 页面内容区 ========== -->
    <div class="page-content">
        <!-- 页面标题 -->
        <div class="page-header d-flex justify-content-between align-items-center">
            <h1 class="page-title">
                <i class="bi bi-building"></i>宿舍档案<span class="total-count">（共 <span id="totalCount">6</span> 间）</span>
            </h1>
            <div class="btn-group" role="group">
                <a href="create.html" class="btn btn-success"><i class="bi bi-plus-lg"></i> 新增</a>
            </div>
        </div>

        <!-- 筛选区 -->
        <div class="filter-card">
            <form class="filter-row flex-nowrap" onsubmit="event.preventDefault(); render();">
                <div class="filter-item">
                    <label class="form-label small text-muted mb-1">楼栋</label>
                    <select id="building" class="form-select">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label class="form-label small text-muted mb-1">楼层</label>
                    <input type="number" id="floor" class="form-control" placeholder="如：3">
                </div>
                <div class="filter-item">
                    <label class="form-label small text-muted mb-1">状态</label>
                    <select id="isActive" class="form-select">
                        <option value="">全部</option>
                        <option value="1">启用</option>
                        <option value="0">停用</option>
                    </select>
                </div>
                <div class="filter-item flex-grow">
                    <label class="form-label small text-muted mb-1">关键词</label>
                    <input type="text" id="keyword" class="form-control" placeholder="房号/地址">
                </div>
                <div class="filter-item">
                    <button type="submit" class="btn btn-primary filter-btn"><i class="bi bi-search"></i> 查询</button>
                </div>
                <div class="filter-item">
                    <button class="btn btn-outline-secondary filter-btn" onclick="FilterPersistence.resetFilters('dorms')"><i class="bi bi-arrow-clockwise"></i> 重置</button>
                </div>
            </form>
        </div>

        <!-- 数据表格 -->
        <div class="content-card">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th width="50">序号</th>
                            <th>房号</th><th>楼栋</th><th>楼层</th><th>地址</th>
                            <th>房间数</th><th>容量</th>
                            <th>在住人数</th><th>使用率</th>
                            <th>状态</th><th width="220">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
            <div class="card-footer" id="pager"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data.js"></script>
    <script src="../_shared/storage-keys.js"></script>
<script src="../_shared/tab-bar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            mountTabBar({ basePath: '..', currentUrl: 'dorms/list.html' });
        });

        const bSel = document.getElementById('building');
        BUILDINGS.forEach(b => bSel.innerHTML += `<option value="${b}">${b}</option>`);

        function getFiltered() {
            const b = bSel.value, f = document.getElementById('floor').value;
            const ia = document.getElementById('isActive').value;
            const kw = document.getElementById('keyword').value.trim().toLowerCase();
            return DORMS.filter(d =>
                (!b || d.building === b) &&
                (!f || d.floor == f) &&
                (ia === '' || (ia === '1' ? d.isActive : !d.isActive)) &&
                (!kw || d.dormCode.toLowerCase().includes(kw) || (d.address || '').toLowerCase().includes(kw))
            );
        }

        const list = registerList({
            key: 'dorms', footId: 'pager', getData: getFiltered, totalId: 'totalCount',
            renderRows: (items, total, start) => {
                const tbody = document.getElementById('tbody');
                if (total === 0) {
                    tbody.innerHTML = `<tr><td colspan="11" class="text-center text-muted py-4">暂无宿舍</td></tr>`;
                    return;
                }
                tbody.innerHTML = items.map((d, idx) => {
                    const residents = currentResidents(d.dormCode);
                    const usage = Math.round(residents / d.capacity * 100);
                    const usageColor = usage >= 100 ? 'bg-danger' : usage >= 75 ? 'bg-warning text-dark' : 'bg-success';
                    const serialNum = start + idx + 1;
                    return `
                    <tr>
                        <td class="text-center text-muted">${serialNum}</td>
                        <td><strong>${d.dormCode}</strong></td>
                        <td>${d.building || '-'}</td>
                        <td>${d.floor || '-'}</td>
                        <td><small class="text-muted">${d.address || '-'}</small></td>
                        <td>${d.roomCount}</td>
                        <td>${d.capacity}</td>
                        <td>
                            <span class="badge ${residents > 0 ? 'bg-primary' : 'bg-light text-dark'}">${residents}</span>
                            / ${d.capacity}
                        </td>
                        <td>
                            <div class="progress" style="height: 18px; min-width: 80px;">
                                <div class="progress-bar ${usageColor}" style="width: ${usage}%">${usage}%</div>
                            </div>
                        </td>
                        <td>${d.isActive ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">停用</span>'}</td>
                        <td>
                            <a href="details.html?code=${d.dormCode}" class="btn btn-sm btn-outline-info">详情</a>
                            <a href="edit.html?id=${d.id}" class="btn btn-sm btn-outline-primary">编辑</a>
                            <button class="btn btn-sm btn-outline-danger" onclick="del(${d.id}, '${d.dormCode}')">删除</button>
                        </td>
                    </tr>`;
                }).join('');
            }
        });

        function render() { list.reset(); }

        function del(id, code) {
            if (!confirm(`确定删除宿舍 "${code}" 吗？\n（如有在住员工或未完成账单则不能删除）`)) return;
            alert(`✓ 原型演示：宿舍 ${code} 已删除\n（实际将 DELETE /api/v1/dorms/${id}）`);
        }

        render();
    </script>
    <!-- 筛选条件持久化（v2.12.10 新增） -->
    <script src="../_shared/filter-persistence.js"></script>
</body>
</html>
