<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>编辑住宿 — v2.10 原型</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>body { font-family: "Microsoft YaHei UI", sans-serif; background: #f5f7fa; } .navbar-brand { font-weight: bold; color: #1976d2 !important; }</style>
    <link rel="stylesheet" href="../_shared/layout-tab.css">
</head>
<body>
        <!-- ========== Tier 1: 顶部品牌栏 (48px) ========== -->
    <div class="top-bar">
        <div class="d-flex justify-content-between align-items-center h-100">
            <div class="d-flex align-items-center">
                <i class="bi bi-droplet-half brand-icon"></i>
                <span class="brand-text">金智住宿管理系统</span>
                <span class="brand-version">v2.12.0</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a class="user-pill" href="../profile/index.html"><i class="bi bi-person-circle"></i><span>管理员</span></a>
                <a href="#" class="btn-exit" title="退出登录" aria-label="退出登录">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </a>
            </div>
        </div>
    </div>

    <!-- ========== Tier 3: Tab 页签栏 (40px) ========== -->
    <div id="tab-bar"></div>

    <!-- ========== Tier 4: 页面内容区 ========== -->
    <div class="page-content">

    <h2 class="mb-3"><i class="bi bi-pencil"></i> 编辑住宿</h2>

        <div class="card">
            <div class="card-body">
                <form onsubmit="event.preventDefault(); submitForm();">
                    <div class="row g-3">
                        <div class="filter-item">
                            <label class="form-label">房号</label>
                            <input type="text" id="dormCode" class="form-control" disabled>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">楼栋 <span class="text-danger">*</span></label>
                            <select id="building" class="form-select" required></select>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">楼层 <span class="text-danger">*</span></label>
                            <input type="number" id="floor" class="form-control" required>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">详细地址</label>
                            <input type="text" id="address" class="form-control">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">房间数</label>
                            <input type="number" id="roomCount" class="form-control" required>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">容量</label>
                            <input type="number" id="capacity" class="form-control" required>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">床位数</label>
                            <input type="number" id="bedCount" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">备注</label>
                            <textarea id="remark" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input id="isActive" class="form-check-input" type="checkbox">
                                <label class="form-check-label">启用此住宿</label>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <a href="list.html" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> 保存</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data.js"></script>
    <script>
        const bSel = document.getElementById('building');
        BUILDINGS.forEach(b => bSel.innerHTML += `<option value="${b}">${b}</option>`);

        const id = parseInt(new URLSearchParams(location.search).get('id')) || 1;
        const dorm = DORMS.find(d => d.id === id) || DORMS[0];

        document.getElementById('dormCode').value = dorm.dormCode;
        document.getElementById('building').value = dorm.building;
        document.getElementById('floor').value = dorm.floor;
        document.getElementById('address').value = dorm.address || '';
        document.getElementById('roomCount').value = dorm.roomCount;
        document.getElementById('capacity').value = dorm.capacity;
        document.getElementById('bedCount').value = dorm.bedCount;
        document.getElementById('remark').value = dorm.remark || '';
        document.getElementById('isActive').checked = dorm.isActive;

        function submitForm() {
            alert(`✓ 原型演示：住宿 ${dorm.dormCode} 已更新\n（实际将 PUT /api/v1/dorms/${id}）`);
            location.href = 'list.html';
        }
    </script>
    <script src="../_shared/storage-keys.js"></script>
<script src="../_shared/tab-bar.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', function() {
            mountTabBar({ basePath: '..', currentUrl: 'dorms/edit.html' });
        });
    </script>
</body>
</html>
