<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>宿舍住宿历史 — v2.10 原型</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>body { font-family: "Microsoft YaHei UI", sans-serif; background: #f5f7fa; } .navbar-brand { font-weight: bold; color: #1976d2 !important; } .timeline { border-left: 2px solid #1976d2; padding-left: 20px; margin-left: 10px; } .timeline-item { position: relative; padding: 10px 0 10px 0; border-bottom: 1px dashed #dee2e6; } .timeline-item::before { content: ''; position: absolute; left: -28px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: #1976d2; } .timeline-item.left::before { background: #6c757d; }</style>
    <link rel="stylesheet" href="../_shared/layout-tab.css">
</head>
<body>
        <!-- ========== Tier 1: 顶部品牌栏 (48px) ========== -->
    <div class="top-bar">
        <div class="d-flex justify-content-between align-items-center h-100">
            <div class="d-flex align-items-center">
                <i class="bi bi-droplet-half brand-icon"></i>
                <span class="brand-text">金戈宿舍管理系统</span>
                <span class="brand-version">v2.12.0</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a class="user-pill" href="../profile/index.html"><i class="bi bi-person-circle"></i><span>管理员</span></a>
                <a href="#" class="btn-exit" title="退出登录" aria-label="退出登录">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </a>
            </div>
        </div>
    </div>

    <!-- ========== Tier 3: Tab 页签栏 (40px) ========== -->
    <div id="tab-bar"></div>

    <!-- ========== Tier 4: 页面内容区 ========== -->
    <div class="page-content">

    <h2 class="mb-3"><i class="bi bi-clock-history"></i> 住宿历史 <span class="text-muted">/</span> <span id="dormCode"></span></h2>

        <div class="row">
            <div class="filter-item">
                <div class="card">
                    <div class="card-header bg-light"><strong>宿舍信息</strong></div>
                    <div class="card-body" id="dormInfo"></div>
                </div>
                <div class="mt-3">
                    <div class="card border-info">
                        <div class="card-body text-center">
                            <small class="text-muted">累计住宿人次</small>
                            <div class="display-6 text-info" id="totalCount">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="filter-item">
                <div class="card">
                    <div class="card-header bg-light"><strong><i class="bi bi-list-ul"></i> 历史记录</strong></div>
                    <div class="card-body">
                        <div class="timeline" id="timeline"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a href="list.html" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> 返回宿舍列表</a>
            <a href="details.html?code=D-301" class="btn btn-info text-white"><i class="bi bi-info-circle"></i> 返回宿舍详情</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data.js"></script>
    <script>
        const code = new URLSearchParams(location.search).get('code') || 'D-301';
        const dorm = findDorm(code);
        document.getElementById('dormCode').textContent = code;

        document.getElementById('dormInfo').innerHTML = `
            <table class="table table-sm table-borderless mb-0">
                <tr><th width="80" class="text-muted">房号</th><td><strong>${dorm.dormCode}</strong></td></tr>
                <tr><th class="text-muted">楼栋</th><td>${dorm.building}</td></tr>
                <tr><th class="text-muted">楼层</th><td>${dorm.floor}</td></tr>
                <tr><th class="text-muted">地址</th><td>${dorm.address}</td></tr>
                <tr><th class="text-muted">容量</th><td>${dorm.capacity} 人</td></tr>
            </table>
        `;

        const history = dormHistory(code);
        document.getElementById('totalCount').textContent = history.length;

        const timeline = document.getElementById('timeline');
        if (history.length === 0) {
            timeline.innerHTML = '<div class="text-muted text-center py-4">暂无住宿记录</div>';
        } else {
            timeline.innerHTML = history.map(r => {
                const emp = findEmployee(r.employeeId);
                const isActive = r.status === 1;
                const stayDays = r.leaveDate
                    ? Math.floor((new Date(r.leaveDate) - new Date(r.checkInDate)) / (1000*60*60*24))
                    : Math.floor((new Date() - new Date(r.checkInDate)) / (1000*60*60*24));
                return `
                <div class="timeline-item ${isActive ? '' : 'left'}">
                    <div class="d-flex justify-content-between">
                        <div>
                            <strong>${emp.realName}</strong>
                            <small class="text-muted ms-2">${emp.employeeCode} | ${emp.department}</small>
                            ${isActive ? '<span class="badge bg-success ms-2">在宿</span>' : '<span class="badge bg-secondary ms-2">已退宿</span>'}
                        </div>
                        <small class="text-muted">${r.reason || ''}</small>
                    </div>
                    <div class="mt-1 text-muted small">
                        <i class="bi bi-box-arrow-in-right"></i> 入住：${formatDate(r.checkInDate)}
                        ${r.leaveDate ? `<i class="bi bi-box-arrow-right ms-3"></i> 退宿：${formatDate(r.leaveDate)}` : '<i class="bi bi-hourglass-split ms-3"></i> 至今'}
                        <i class="bi bi-clock ms-3"></i> 共 ${stayDays} 天
                    </div>
                </div>`;
            }).join('');
        }
    </script>
    <script src="../_shared/storage-keys.js"></script>
<script src="../_shared/tab-bar.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', function() {
            mountTabBar({ basePath: '..', currentUrl: 'dorms/history.html' });
        });
    </script>
</body>
</html>
