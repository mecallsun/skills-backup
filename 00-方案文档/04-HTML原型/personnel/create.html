<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新增人员 — 金戈宿舍管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../_shared/layout-tab.css">
    <style>
        body { font-family: "Microsoft YaHei UI", sans-serif; background: var(--bg-page); }
        /* v2.12.26 紧凑一屏完整展示：去掉规范信息，减小行间距 */
        .form-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eee; overflow: hidden; }
        .form-card-header { padding: 0.75rem 1.25rem; border-bottom: 1px solid #eee; background: #fafbfc; display: flex; align-items: center; gap: 0.5rem; }
        .form-card-header h3 { margin: 0; font-size: 1rem; font-weight: 600; color: #1976d2; }
        .form-card-body { padding: 1rem 1.25rem; }
        .form-section { margin-bottom: 0.75rem; }
        .form-section-title { font-size: 0.85rem; font-weight: 600; color: #1976d2; border-left: 3px solid #1976d2; padding-left: 0.5rem; margin-bottom: 0.5rem; }
        .form-field { margin-bottom: 0.6rem; }
        .form-label { font-size: 0.85rem; font-weight: 500; color: #495057; margin-bottom: 0.2rem; }
        .form-label .required { color: #dc3545; margin-left: 2px; }
        .form-control, .form-select { border-radius: 6px; padding: 0.375rem 0.75rem; font-size: 0.9rem; }
        .form-actions { background: #fafbfc; border-top: 1px solid #eee; padding: 0.75rem 1.25rem; display: flex; justify-content: flex-end; gap: 0.75rem; align-items: center; }
        .form-actions .btn { min-width: 100px; }
        .form-readonly { background: #f5f7fa; cursor: not-allowed; }
        /* 一屏完整展示：去掉规范信息卡片（v2.12.26） */
    </style>
</head>
<body>
    <!-- ========== Tier 1: 顶部品牌栏 ========== -->
    <div class="top-bar">
        <div class="d-flex justify-content-between align-items-center h-100">
            <div class="d-flex align-items-center">
                <i class="bi bi-droplet-half brand-icon"></i>
                <span class="brand-text">金戈宿舍管理系统</span>
                <span class="brand-version">v2.12.0</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a class="user-pill" href="../profile/index.html"><i class="bi bi-person-circle"></i><span>管理员</span></a>
                <a href="#" class="btn-exit" title="退出登录" aria-label="退出登录">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </a>
            </div>
        </div>
    </div>

    <!-- ========== Tier 2: Tab 页签栏 ========== -->
    <div id="tab-bar"></div>

    <!-- ========== Tier 3: 页面内容区 ========== -->
    <div class="page-content">
        <!-- 页头 -->
        <div class="page-header d-flex justify-content-between align-items-center">
            <h1 class="page-title">
                <i class="bi bi-person-plus"></i>新增人员
                <small class="text-muted ms-2 fs-6">录入新员工的基本信息与住宿初始状态</small>
            </h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="list.html">人员清单</a></li>
                    <li class="breadcrumb-item active" aria-current="page">新增人员</li>
                </ol>
            </nav>
        </div>

        <!-- 表单卡片（v2.12.26：去掉规范信息提示卡片） -->
        <div class="form-card">
            <div class="form-card-header">
                <i class="bi bi-clipboard-plus text-primary"></i>
                <h3>人员信息录入</h3>
            </div>

            <form onsubmit="event.preventDefault(); submitForm();">
                <div class="form-card-body">

                    <!-- 区块 1：基本信息（4 字段） -->
                    <div class="form-section">
                        <div class="form-section-title">基本信息</div>
                        <div class="row g-2">
                            <div class="col-md-3 form-field">
                                <label class="form-label">工号<span class="required">*</span></label>
                                <input type="text" id="employeeCode" class="form-control" required maxlength="20" placeholder="EMP-2026-NNN">
                            </div>
                            <div class="col-md-3 form-field">
                                <label class="form-label">姓名<span class="required">*</span></label>
                                <input type="text" id="realName" class="form-control" required maxlength="50">
                            </div>
                            <div class="col-md-3 form-field">
                                <label class="form-label">手机号</label>
                                <input type="tel" id="phone" class="form-control" maxlength="20" placeholder="11位手机号">
                            </div>
                            <div class="col-md-3 form-field">
                                <label class="form-label">性别<span class="required">*</span></label>  <!-- v2.13.86 新增 -->
                                <select id="gender" class="form-select" required>
                                    <option value="1">男</option>
                                    <option value="2">女</option>
                                </select>
                            </div>
                            <div class="col-md-3 form-field">
                                <label class="form-label">入职日期<span class="required">*</span></label>
                                <input type="date" id="hireDate" class="form-control" required value="2026-07-10">
                            </div>
                        </div>
                    </div>

                    <!-- 区块 2：组织与岗位（5 字段，关联引用基础资料字典） -->
                    <div class="form-section">
                        <div class="form-section-title">组织与岗位</div>
                        <div class="row g-2">
                            <div class="col-md-3 form-field">
                                <label class="form-label">部门<span class="required">*</span></label>
                                <select id="departmentId" class="form-select" required>
                                    <option value="">请选择部门</option>
                                </select>
                            </div>
                            <div class="col-md-3 form-field">
                                <label class="form-label">员工类型<span class="required">*</span></label>
                                <select id="employeeTypeId" class="form-select" required>
                                    <option value="">请选择员工类型</option>
                                </select>
                            </div>
                            <div class="col-md-3 form-field">
                                <label class="form-label">考勤班次<span class="required">*</span></label>
                                <select id="attendanceTypeId" class="form-select" required>
                                    <option value="">请选择考勤班次</option>
                                </select>
                            </div>
                            <div class="col-md-3 form-field">
                                <label class="form-label">班组</label>
                                <select id="teamId" class="form-select">
                                    <option value="">请选择班组</option>
                                </select>
                            </div>
                            <div class="col-md-3 form-field">
                                <label class="form-label">在职状态<span class="required">*</span></label>
                                <select id="employmentStatusId" class="form-select" required>
                                    <option value="">请选择在职状态</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 区块 3：住宿信息（房号只读，通过办理登记分配） -->
                    <div class="form-section">
                        <div class="form-section-title">住宿信息</div>
                        <div class="row g-2">
                            <div class="col-md-3 form-field">
                                <label class="form-label">房号</label>
                                <input type="text" id="dormCode" class="form-control form-readonly" readonly placeholder="通过办理登记分配">
                            </div>
                        </div>
                    </div>

                    <!-- 区块 4：备注（跨整行） -->
                    <div class="form-section" style="margin-bottom: 0;">
                        <div class="form-section-title">其他信息</div>
                        <div class="form-field" style="margin-bottom: 0;">
                            <label class="form-label">备注</label>
                            <textarea id="remark" class="form-control" rows="2" maxlength="500" placeholder="选填"></textarea>
                        </div>
                    </div>

                </div>

                <!-- 操作按钮区 -->
                <div class="form-actions">
                    <a href="list.html" class="btn btn-outline-secondary"><i class="bi bi-x"></i> 取消</a>
                    <button type="button" class="btn btn-outline-primary" onclick="resetForm()"><i class="bi bi-arrow-counterclockwise"></i> 重置</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 保存人员</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data.js"></script>
    <script src="../_shared/storage-keys.js"></script>
    <script src="../_shared/tab-bar.js"></script>
    <script>
    // ========== 初始化基础资料字典下拉 ==========
    function initBasicDataSelects() {
        var deptSel = document.getElementById('departmentId');
        if (deptSel && typeof DEPARTMENTS !== 'undefined') {
            DEPARTMENTS.forEach(function (d) {
                deptSel.appendChild(new Option(d.name, d.id));
            });
        }

        var typeSel = document.getElementById('employeeTypeId');
        if (typeSel && typeof EMPLOYEE_TYPES !== 'undefined') {
            EMPLOYEE_TYPES.forEach(function (t) {
                typeSel.appendChild(new Option(t.name, t.id));
            });
        }

        var attendSel = document.getElementById('attendanceTypeId');
        if (attendSel && typeof ATTENDANCE_TYPES_FULL !== 'undefined') {
            ATTENDANCE_TYPES_FULL.forEach(function (a) {
                attendSel.appendChild(new Option(a.name + '（' + a.workHours + '）', a.id));
            });
        }

        var statusSel = document.getElementById('employmentStatusId');
        if (statusSel && typeof EMPLOYMENT_STATUSES !== 'undefined') {
            EMPLOYMENT_STATUSES.forEach(function (s) {
                statusSel.appendChild(new Option(s.name, s.id));
            });
            statusSel.value = '1';
        }

        // 班组（关联引用基础资料-员工班组字典 v2.12.2）
        var teamSel = document.getElementById('teamId');
        if (teamSel && typeof TEAMS !== 'undefined') {
            TEAMS.forEach(function (t) {
                teamSel.appendChild(new Option(t.name, t.id));
            });
            teamSel.value = '1'; // 默认=1 默认班组
        }
    }

    // ========== 表单提交 ==========
    function submitForm() {
        var code = document.getElementById('employeeCode').value.trim();
        var name = document.getElementById('realName').value.trim();
        var deptId = document.getElementById('departmentId').value;
        var typeId = document.getElementById('employeeTypeId').value;
        var attendId = document.getElementById('attendanceTypeId').value;
        var statusId = document.getElementById('employmentStatusId').value;

        if (!code) { alert('❌ 工号不能为空'); return; }
        if (!name) { alert('❌ 姓名不能为空'); return; }
        if (!deptId) { alert('❌ 请选择部门'); return; }
        if (!typeId) { alert('❌ 请选择员工类型'); return; }
        if (!attendId) { alert('❌ 请选择考勤班次'); return; }
        if (!statusId) { alert('❌ 请选择在职状态'); return; }

        if (typeof PERSONNEL !== 'undefined' && PERSONNEL.some(function (p) { return p.employeeCode === code; })) {
            alert('❌ 工号已存在：' + code);
            return;
        }

        alert('✅ 原型演示：员工 ' + name + ' 已保存');
        location.href = 'list.html';
    }

    function resetForm() {
        if (!confirm('确定要重置所有已填字段吗？')) return;
        document.getElementById('employeeCode').value = '';
        document.getElementById('realName').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('hireDate').value = '2026-07-10';
        document.getElementById('departmentId').value = '';
        document.getElementById('employeeTypeId').value = '';
        document.getElementById('attendanceTypeId').value = '';
        document.getElementById('teamId').value = '1';
        document.getElementById('employmentStatusId').value = '1';
        document.getElementById('remark').value = '';
    }

    document.addEventListener('DOMContentLoaded', function () {
        if (typeof mountTabBar === 'function') {
            mountTabBar({ basePath: '..', currentUrl: 'personnel/create.html' });
        }
        initBasicDataSelects();
    });
    </script>
</body>
</html>
