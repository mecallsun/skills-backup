<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Personnel Debug</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../_shared/layout-tab.css">
</head>
<body>
<div id="debug"></div>
<div class="page-content">
<div class="content-card">
<table class="table"><tbody id="tbody"></tbody></table>
<div id="pager"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="../mock-data.js"></script>
<script src="../_shared/storage-keys.js"></script>
<script src="../_shared/tab-bar.js"></script>
<script>
function attendanceBadge(id) {
    const t = ATTENDANCE_TYPES_FULL.find(x => x.id === id);
    if (!t) return '<span class="text-muted">-</span>';
    const cls = ATTENDANCE_BADGE[t.code] || 'bg-secondary';
    return '<span class="badge ' + cls + '">' + t.name + '</span>';
}
function employmentBadge(id) {
    if (id === 1) return '<span class="badge bg-success">在职</span>';
    if (id === 2) return '<span class="badge bg-warning text-dark">待入职</span>';
    if (id === 3) return '<span class="badge bg-secondary">已离职</span>';
    return '<span class="text-muted">-</span>';
}
function typeBadge(id) {
    const t = EMPLOYEE_TYPES.find(x => x.id === id);
    if (!t) return '<span class="text-muted">-</span>';
    const colors = { 1: 'bg-secondary', 2: 'bg-warning text-dark', 3: 'bg-info text-dark', 4: 'bg-success', 5: 'bg-primary' };
    return '<span class="badge ' + (colors[id] || 'bg-secondary') + '">' + t.name + '</span>';
}
function resideBadge(code) {
    if (code) return '<span class="badge bg-primary">已分配</span>';
    return '<span class="badge bg-light text-dark">未分配</span>';
}

function getFiltered() {
    return PERSONNEL;
}

const list = registerList({
    key: 'personnel',
    footId: 'pager',
    totalId: 'result',
    getData: getFiltered,
    renderRows: (items, total, start) => {
        document.getElementById('debug').textContent = 'renderRows called: total=' + total + ' items.length=' + items.length;
        const tbody = document.getElementById('tbody');
        if (total === 0) {
            tbody.innerHTML = '<tr><td colspan="11">暂无数据</td></tr>';
            return;
        }
        tbody.innerHTML = items.slice(0, 5).map((p, idx) => {
            return '<tr>'
                + '<td>' + (start + idx + 1) + '</td>'
                + '<td>' + p.employeeCode + '</td>'
                + '<td>' + p.realName + '</td>'
                + '<td>' + getDepartmentName(p.departmentId) + '</td>'
                + '<td>' + typeBadge(p.employeeTypeId) + '</td>'
                + '<td>' + attendanceBadge(p.attendanceTypeId) + '</td>'
                + '<td>' + employmentBadge(p.employmentStatusId) + '</td>'
                + '<td>' + resideBadge(p.dormCode) + '</td>'
                + '</tr>';
        }).join('');
    }
});

document.addEventListener('DOMContentLoaded', function() {
    list.draw();
});
</script>
</body></html>
