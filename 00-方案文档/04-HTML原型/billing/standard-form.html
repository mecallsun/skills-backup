<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新增/编辑费用标准 — v2.11 原型</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>body { font-family: "Microsoft YaHei UI", sans-serif; background: #f5f7fa; } .navbar-brand { font-weight: bold; color: #1976d2 !important; }</style>
    <link rel="stylesheet" href="../_shared/layout-tab.css">
</head>
<body>
        <!-- ========== Tier 1: 顶部品牌栏 (48px) ========== -->
    <div class="top-bar">
        <div class="d-flex justify-content-between align-items-center h-100">
            <div class="d-flex align-items-center">
                <i class="bi bi-droplet-half brand-icon"></i>
                <span class="brand-text">金戈宿舍管理系统</span>
                <span class="brand-version">v2.12.0</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="user-pill">
                    <i class="bi bi-person-circle"></i>
                    <span>管理员</span>
                </span>
                <a href="#" class="btn-exit" title="退出登录" aria-label="退出登录">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </a>
            </div>
        </div>
    </div>

    <!-- ========== Tier 3: Tab 页签栏 (40px) ========== -->
    <div id="tab-bar"></div>

    <!-- ========== Tier 4: 页面内容区 ========== -->
    <div class="page-content">

    <div class="card">
            <div class="card-body">
                <form onsubmit="event.preventDefault(); submitForm();">
                    <div class="row g-3">
                        <div class="filter-item">
                            <label class="form-label">标准名称 <span class="text-danger">*</span></label>
                            <input type="text" id="standardName" class="form-control" required placeholder="如：2026下半年-合同工">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">生效开始 <span class="text-danger">*</span></label>
                            <input type="date" id="effectiveFrom" class="form-control" required value="2026-07-01">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">生效结束（可选）</label>
                            <input type="date" id="effectiveTo" class="form-control">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">热水单价 <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" id="hotWaterPrice" step="0.01" min="0" class="form-control" required value="25.00">
                                <span class="input-group-text">元/m³</span>
                            </div>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">冷水单价 <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" id="coldWaterPrice" step="0.01" min="0" class="form-control" required value="4.50">
                                <span class="input-group-text">元/m³</span>
                            </div>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">电单价 <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" id="electricityPrice" step="0.0001" min="0" class="form-control" required value="0.80">
                                <span class="input-group-text">元/度</span>
                            </div>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">适用员工类型 <span class="text-danger">*</span></label>
                            <select id="applicableType" class="form-select" required>
                                <option value="合同工" selected>合同工</option>
                                <option value="临时工">临时工</option>
                                <option value="外包">外包</option>
                                <option value="实习生">实习生</option>
                                <option value="驻场">驻场</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">备注</label>
                            <textarea id="remark" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input id="isActive" class="form-check-input" type="checkbox" checked>
                                <label class="form-check-label">启用此标准</label>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <a href="standards.html" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> 保存</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data.js"></script>
    <script>

        const id = new URLSearchParams(location.search).get('id');
        if (id) {
            document.getElementById('pageTitle').textContent = '编辑费用标准';
            const s = BILLING_STANDARDS.find(x => x.id == id);
            if (s) {
                document.getElementById('standardName').value = s.standardName;
                document.getElementById('effectiveFrom').value = s.effectiveFrom;
                document.getElementById('effectiveTo').value = s.effectiveTo || '';
                document.getElementById('hotWaterPrice').value = s.hotWaterPrice;
                document.getElementById('coldWaterPrice').value = s.coldWaterPrice;
                document.getElementById('electricityPrice').value = s.electricityPrice;
                document.getElementById('applicableType').value = s.applicableType;
                document.getElementById('remark').value = s.remark || '';
                document.getElementById('isActive').checked = s.isActive;
            }
        }

        function submitForm() {
            const name = document.getElementById('standardName').value.trim();
            const type = document.getElementById('applicableType').value;
            if (!name) { alert('标准名称必填'); return; }
            alert(`✓ 原型演示：标准 ${name} 已保存\n适用类型：${type}\n（实际将 ${id ? 'PUT' : 'POST'} /api/v1/billing/standards${id ? '/' + id : ''}）\n\n⚠️ 若启用且同类型已有生效标准，旧标准将自动失效`);
            location.href = 'standards.html';
        }
    </script>
    <script src="../_shared/storage-keys.js"></script>
<script src="../_shared/tab-bar.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', function() {
            mountTabBar({ basePath: '..', currentUrl: 'billing/standard-form.html' });
        });
    </script>
</body>
</html>
