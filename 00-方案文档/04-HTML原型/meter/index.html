<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>抄表记录 — 金戈宿舍管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #1976d2;
            --success: #2e7d32;
            --warning: #e65100;
            --danger: #c62828;
            --info: #00838f;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --bg-page: #f5f7fa;
            --bg-card: #ffffff;
            --border-color: #e8eaed;
        }
        body {
            font-family: "Microsoft YaHei UI", sans-serif;
            background: var(--bg-page);
            margin: 0;
        }

        /* 顶部品牌栏 */
        

        /* 菜单导航栏 */
        .menu-bar {
            background: #fff;
            border-bottom: 1px solid #e8eaed;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            padding: 0 1.5rem;
            display: flex;
            align-items: stretch;
            overflow-x: auto;
        }
        .menu-bar::-webkit-scrollbar { display: none; }

        /* 菜单项 */
        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.85rem 1.15rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #5f6368;
            text-decoration: none;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .menu-item:hover { color: #1976d2; background: #f0f7ff; }
        .menu-item.active { color: #1976d2; border-bottom-color: #1976d2; font-weight: 600; }
        .menu-item i { font-size: 1.1rem; }

        /* 菜单分隔符 */
        .menu-sep { width: 1px; background: #e0e0e0; margin: 0.5rem 0.25rem; flex-shrink: 0; }

        /* 页面标题 */
        .page-header {
            padding: 1rem 0;
            margin-bottom: 1rem;
        }
        .page-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .page-title i { color: var(--primary); }

        /* 筛选区卡片 */
        .filter-card {
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border: 1px solid #eee;
            padding: 1rem 1.25rem;
        }

        /* 筛选区一行排列 */
        .filter-row { display: flex; flex-wrap: nowrap; align-items: flex-end; gap: 0.75rem; overflow-x: auto; }
        .filter-item { flex: 1 1 0; min-width: 140px; max-width: 200px; }
        .filter-item label { font-size: 0.75rem; color: #6c757d; margin-bottom: 0.25rem; display: block; }
        .filter-item .form-control, .filter-item .form-select { height: 32px; font-size: 0.875rem; padding: 0.25rem 0.5rem; }
        .filter-actions { flex: 0 0 auto; display: flex; gap: 0.5rem; }

        /* 内容卡片 */
        .content-card {
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border: 1px solid #eee;
            overflow: hidden;
        }

        /* 表格 */
        .table thead th {
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
        .table-hover tbody tr:hover {
            background-color: #f8f9ff;
        }
        .table tbody td {
            vertical-align: middle;
        }

        /* 用量列样式 - v2.11.3(q) 增补；v2.11.15 优化未完成/0值单元格样式 */
        .usage-cell {
            padding: 0.5rem 0.75rem !important;
            vertical-align: middle;
        }
        .usage-value {
            display: inline-block;
            min-width: 60px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
        }
        .usage-normal {
            color: #333;
            background: transparent;
        }
        /* v2.11.15.c BUGFIX/样式优化：移除框线风格（border），改为文本背景风格
           背景风格及高度与状态列 Badge 完全一致，背景色改为亮蓝色 #cfe2ff
           适用于：抄表数为0 或 未抄表项的单元格 */
        .usage-unfinished {
            color: #084c61;
            background: #cfe2ff;
            /* border: 1px solid #ffb74d; */ /* 旧版框线风格已废弃 */
            /* v2.11.15.b 高度规范：与 Bootstrap .badge 一致
               padding 0.35em 0.65em + line-height 1 + font-size 0.75em
               保证单元格与"正常" Badge 视觉高度完全对齐 */
            display: inline-block;
            padding: 0.35em 0.65em;
            font-size: 0.75em;
            font-weight: 500;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            vertical-align: baseline;
            border-radius: 0.375rem;
        }
        .usage-first {
            color: #6c757d;
            font-style: italic;
        }

        /* 按钮 */
        .btn i { margin-right: 0.25rem; }

        /* v2.12.36 手动补录模态弹窗紧凑样式 */
        .modal-body .form-section { margin-bottom: 0.6rem; }
        .modal-body .form-section-title { font-size: 0.85rem; font-weight: 600; color: #1976d2; border-left: 3px solid #1976d2; padding-left: 0.5rem; margin-bottom: 0.4rem; }
        .modal-body .form-field { margin-bottom: 0.5rem; }
        .modal-body .form-label { font-size: 0.85rem; font-weight: 500; color: #495057; margin-bottom: 0.2rem; }
        .modal-body .form-label .required { color: #dc3545; margin-left: 2px; }
        .modal-body .form-control, .modal-body .form-select { border-radius: 6px; padding: 0.375rem 0.75rem; font-size: 0.9rem; }
        .upload-ph { border: 2px dashed #cfd8dc; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #90a4ae; cursor: pointer; }
        .upload-ph:hover { border-color: #1976d2; color: #1976d2; }

        /* 筛选区查询按钮统一风格 */
        .filter-btn {
            min-width: 100px !important;
            max-width: 100px !important;
            width: 100px !important;
            height: 38px !important;
            min-height: 38px !important;
            max-height: 38px !important;
            line-height: 38px !important;
            padding: 0 16px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 4px !important;
            font-size: 14px !important;
            font-weight: 400 !important;
            border-radius: 6px !important;
            white-space: nowrap !important;
            text-decoration: none !important;
            box-sizing: border-box !important;
        }
        .filter-btn i { font-size: 14px !important; }

        /* 用量列样式 - v2.11.3(q) 增补；v2.11.15 优化未完成/0值单元格样式 */
        .usage-cell {
            padding: 0.5rem 0.75rem !important;
            vertical-align: middle;
        }
        .usage-value {
            display: inline-block;
            min-width: 60px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
        }
        .usage-normal {
            color: #333;
            background: transparent;
        }
        /* v2.11.15.c BUGFIX/样式优化：移除框线风格（border），改为文本背景风格
           背景风格及高度与状态列 Badge 完全一致，背景色改为亮蓝色 #cfe2ff
           适用于：抄表数为0 或 未抄表项的单元格 */
        .usage-unfinished {
            color: #084c61;
            background: #cfe2ff;
            /* border: 1px solid #ffb74d; */ /* 旧版框线风格已废弃 */
            /* v2.11.15.b 高度规范：与 Bootstrap .badge 一致
               padding 0.35em 0.65em + line-height 1 + font-size 0.75em
               保证单元格与"正常" Badge 视觉高度完全对齐 */
            display: inline-block;
            padding: 0.35em 0.65em;
            font-size: 0.75em;
            font-weight: 500;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            vertical-align: baseline;
            border-radius: 0.375rem;
        }
        .usage-first {
            color: #6c757d;
            font-style: italic;
        }
    </style>

</head>
<body>
        <!-- ========== Tier 1: 顶部品牌栏 (48px) ========== -->
<div class="top-bar">
        <div class="d-flex justify-content-between align-items-center h-100">
            <div class="d-flex align-items-center">
                <i class="bi bi-droplet-half brand-icon"></i>
                <span class="brand-text">金戈宿舍管理系统</span>
                <span class="brand-version">v2.12.0</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="user-pill">
                    <i class="bi bi-person-circle"></i>
                    <span>管理员</span>
                </span>
                <a href="#" class="btn-exit" title="退出登录" aria-label="退出登录">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </a>
            </div>
        </div>
    </div>

    <!-- ========== Tier 3: Tab 页签栏 (40px) ========== -->
    <div id="tab-bar"></div>

    <!-- ========== Tier 4: 页面内容区 ========== -->
    <div class="page-content">
<!-- 页面标题 -->
        <div class="page-header d-flex justify-content-between align-items-center">
            <h1 class="page-title">
                <i class="bi bi-clipboard-data-fill"></i>抄表记录
            </h1>
            <div>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalManualEntry"><i class="bi bi-pencil-square"></i> 手动补录</button>
                <a href="import.html" class="btn btn-primary"><i class="bi bi-file-earmark-arrow-up"></i> 批量导入</a>
                <button class="btn btn-outline-secondary" onclick="exportExcel()"><i class="bi bi-download"></i> 导出 Excel</button>
            </div>
        </div>

        <!-- 提示框 -->
        <div class="alert alert-info mb-3" style="border-radius:8px;">
            <i class="bi bi-info-circle"></i> PDA 现场抄表上传的三表读数（冷水/热水/电），每间宿舍每月一条；本月用量 = 本月读数 − 上月读数，作为宿舍账单的计费依据。
        </div>

        <div id="coverage" class="alert alert-secondary mb-3" style="border-radius:8px;"></div>

        <!-- 筛选区 -->
        <div class="filter-card mb-3">
            <form class="filter-row flex-nowrap" onsubmit="event.preventDefault(); render();">
                <div class="filter-item">
                    <label>抄表月份</label>
                    <select id="month" class="form-control"></select>
                </div>
                <div class="filter-item">
                    <label>楼栋</label>
                    <select id="building" class="form-control"><option value="">全部</option></select>
                </div>
                <div class="filter-item">
                    <label>抄表员</label>
                    <select id="operator" class="form-control"><option value="">全部</option></select>
                </div>
                <div class="filter-item">
                    <label>状态</label>
                    <select id="status" class="form-control">
                        <option value="">全部</option>
                        <option value="0">未完成</option>
                        <option value="1">正常</option>
                        <option value="2">已修正</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>房号/地址</label>
                    <input type="text" id="keyword" class="form-control" placeholder="模糊查询">
                </div>
                <div class="filter-actions">
                    <button type="submit" class="btn btn-primary filter-btn"><i class="bi bi-search"></i> 查询</button>
                    <button class="btn btn-outline-secondary filter-btn" onclick="FilterPersistence.resetFilters('meter')"><i class="bi bi-arrow-clockwise"></i> 重置</button>
                </div>
            </form>
        </div>

        <!-- 数据表格 -->
        <div class="content-card">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th width="50">序号</th>
                            <th>房号</th><th>月份</th>
                            <th class="text-end">冷水读数</th><th class="text-end">热水读数</th><th class="text-end">电表读数</th>
                            <th class="text-end">冷水用量</th><th class="text-end">热水用量</th><th class="text-end">电表用量</th>
                            <th>抄表员</th><th>设备</th><th>抄表时间</th><th>状态</th><th width="150">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
            <div class="card-footer" id="pager"></div>
        </div>
    </div>

    <!-- v2.12.36 手动补录 模态弹窗 -->
    <div class="modal fade" id="modalManualEntry" tabindex="-1" data-bs-backdrop="static" aria-labelledby="modalManualEntryLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable" style="max-width: 900px;">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h5 class="modal-title" id="modalManualEntryLabel"><i class="bi bi-pencil-square text-success"></i> 手动补录抄表</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- 区块 1：宿舍 + 月份 + 抄表员（紧凑一行） -->
                    <div class="form-section">
                        <div class="form-section-title">基本信息</div>
                        <div class="row g-2">
                            <div class="col-md-4 form-field">
                                <label class="form-label">宿舍<span class="required">*</span></label>
                                <select id="me_dorm" class="form-select">
                                    <option value="">请选择宿舍</option>
                                </select>
                            </div>
                            <div class="col-md-4 form-field">
                                <label class="form-label">抄表月份<span class="required">*</span></label>
                                <input type="month" id="me_month" class="form-control">
                            </div>
                            <div class="col-md-4 form-field">
                                <label class="form-label">抄表员</label>
                                <input type="text" id="me_operator" class="form-control" value="admin（后台补录）" disabled>
                            </div>
                        </div>
                        <!-- 覆盖/重复警告 -->
                        <div id="me_dupWarn" class="alert alert-danger mt-2 mb-0 py-1" style="display:none; font-size: 0.85rem;"></div>
                        <div id="me_lastRef" class="alert alert-secondary mt-2 mb-0 py-1" style="display:none; font-size: 0.85rem;"></div>
                    </div>

                    <!-- 区块 2：三表读数（紧凑三列卡片） -->
                    <div class="form-section">
                        <div class="form-section-title">三表读数</div>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <div class="card meter-card border-0 shadow-sm" style="border-left: 3px solid #1976d2 !important;">
                                    <div class="card-body py-2">
                                        <h6 class="text-primary mb-1"><i class="bi bi-droplet"></i> 冷水</h6>
                                        <input type="number" step="0.01" min="0" id="me_cold" class="form-control form-control-sm" placeholder="读数（m³）" oninput="onMeterReading()">
                                        <small class="text-muted" id="me_hint_cold">用量：—</small>
                                        <div class="upload-ph mt-1" onclick="alert('原型演示：实际弹出拍照/选图上传（自动加水印）')" style="height: 50px; font-size: 0.8rem;">
                                            <i class="bi bi-camera"></i> 上传照片
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card meter-card border-0 shadow-sm" style="border-left: 3px solid #0dcaf0 !important;">
                                    <div class="card-body py-2">
                                        <h6 class="text-info mb-1"><i class="bi bi-steam"></i> 热水</h6>
                                        <input type="number" step="0.01" min="0" id="me_hot" class="form-control form-control-sm" placeholder="读数（m³）" oninput="onMeterReading()">
                                        <small class="text-muted" id="me_hint_hot">用量：—</small>
                                        <div class="upload-ph mt-1" onclick="alert('原型演示：实际弹出拍照/选图上传（自动加水印）')" style="height: 50px; font-size: 0.8rem;">
                                            <i class="bi bi-camera"></i> 上传照片
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card meter-card border-0 shadow-sm" style="border-left: 3px solid #ffc107 !important;">
                                    <div class="card-body py-2">
                                        <h6 class="text-warning mb-1"><i class="bi bi-lightning"></i> 电</h6>
                                        <input type="number" step="0.01" min="0" id="me_electric" class="form-control form-control-sm" placeholder="读数（度）" oninput="onMeterReading()">
                                        <small class="text-muted" id="me_hint_electric">用量：—</small>
                                        <div class="upload-ph mt-1" onclick="alert('原型演示：实际弹出拍照/选图上传（自动加水印）')" style="height: 50px; font-size: 0.8rem;">
                                            <i class="bi bi-camera"></i> 上传照片
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 区块 3：备注 -->
                    <div class="form-section">
                        <div class="form-section-title">备注</div>

                    <!-- 右侧用量预览 -->
                    <div id="me_usagePreview" class="alert alert-light border mt-2 mb-0 py-2" style="font-size: 0.85rem;">
                        <strong><i class="bi bi-calculator"></i> 本月用量预览</strong>
                        <p class="text-muted small mb-0 mt-1">请选择宿舍与月份，并录入读数</p>
                    </div>
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="bi bi-x"></i> 取消</button>
                    <button type="button" class="btn btn-primary" onclick="meSubmit()"><i class="bi bi-check-lg"></i> 提交</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data.js"></script>
    <script>
        // 初始化筛选下拉
        const monthSel = document.getElementById('month');
        monthSel.innerHTML = '<option value="">全部月份</option>' + meterMonths().map(m => `<option value="${m}">${m}</option>`).join('');
        monthSel.value = meterMonths()[0] || '';
        const bSel = document.getElementById('building');
        BUILDINGS.forEach(b => bSel.innerHTML += `<option value="${b}">${b}</option>`);
        const opSel = document.getElementById('operator');
        METER_OPERATORS.forEach(o => opSel.innerHTML += `<option value="${o}">${o}</option>`);

        function getFiltered() {
            const mo = monthSel.value, b = bSel.value, op = opSel.value;
            const st = document.getElementById('status').value;
            const kw = document.getElementById('keyword').value.trim().toLowerCase();
            return METER_RECORDS.filter(m => {
                const dorm = findDorm(m.dormCode);
                if (mo && m.readMonth !== mo) return false;
                if (b && (!dorm || dorm.building !== b)) return false;
                if (op && m.operator !== op) return false;
                // v2.11.4：状态筛选（0=未完成 1=正常 2=已修正）
                if (st && st !== '') { if (m.status !== parseInt(st)) return false; }
                if (kw && !(m.dormCode.toLowerCase().includes(kw) || (m.dormAddress || '').toLowerCase().includes(kw))) return false;
                return true;
            }).sort((a, b) => b.readMonth.localeCompare(a.readMonth) || a.dormCode.localeCompare(b.dormCode));
        }

        // v2.11.4(q) 增补：获取用量单元格内容（3状态系统：0=未完成 1=正常 2=已修正）
        function usageCell(m, meterType) {
            const u = meterUsage(m);
            const prev = u.prev;

            // 首次抄表（无上月读数）
            if (prev === null) {
                return '<span class="usage-value usage-first">首抄</span>';
            }

            // 根据表类型获取用量值
            const val = meterType === 'cold' ? u.cold : (meterType === 'hot' ? u.hot : u.electric);
            const isZero = meterType === 'cold' ? m.coldMeter === 0 : (meterType === 'hot' ? m.hotMeter === 0 : m.electricMeter === 0);

            // 未完成状态且该表项为0（v2.11.4：status=0）
            if (m.status === 0 && isZero) {
                return `<span class="usage-value usage-unfinished">${val.toFixed(1)}</span>`;
            }

            return `<span class="usage-value usage-normal">+${val.toFixed(1)}</span>`;
        }

        const list = registerList({
            key: 'meter', footId: 'pager', getData: getFiltered,
            renderRows: (items, total, start) => {
                const tbody = document.getElementById('tbody');
                if (total === 0) {
                    tbody.innerHTML = `<tr><td colspan="14" class="text-center text-muted py-4">暂无抄表记录</td></tr>`;
                    return;
                }
                tbody.innerHTML = items.map((m, idx) => {
                    const rowClass = m.status === 0 ? 'table-warning' : '';
                    return `
                    <tr class="${rowClass}">
                        <td class="text-center text-muted">${start + idx + 1}</td>
                        <td><strong>${m.dormCode}</strong></td>
                        <td>${m.readMonth}</td>
                        <td class="text-end">${m.coldMeter.toFixed(2)}</td>
                        <td class="text-end">${m.hotMeter.toFixed(2)}</td>
                        <td class="text-end">${m.electricMeter.toFixed(2)}</td>
                        <td class="text-end">${usageCell(m, 'cold')}</td>
                        <td class="text-end">${usageCell(m, 'hot')}</td>
                        <td class="text-end">${usageCell(m, 'electric')}</td>
                        <td><small>${m.operator || '—'}</small></td>
                        <td><small class="text-muted">${m.deviceSn || '—'}</small></td>
                        <td><small class="text-muted">${m.createdAt || '—'}</small></td>
                        <td><span class="badge ${METER_STATUS_BADGE[m.status]}">${METER_STATUS[m.status]}</span></td>
                        <td>
                            <a href="detail.html?id=${m.id}" class="btn btn-sm btn-outline-info">详情</a>
                            ${m.status === 1 ? `<a href="edit.html?id=${m.id}" class="btn btn-sm btn-outline-primary">修正</a>` : ''}
                            ${m.status === 0 ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteRecord(${m.id}, '${m.dormCode}')">删除</button>` : ''}
                        </td>
                    </tr>`;
                }).join('');
            }
        });

        function render() {
            renderCoverage();
            list.reset();
        }

        function renderCoverage() {
            const mo = monthSel.value || meterMonths()[0];
            const c = meterCoverage(mo);
            const box = document.getElementById('coverage');
            // v2.11.4：计算完成度（已抄+未完成 >= 总数）
            const done = (c.read + c.unfinished) >= c.total;
            box.className = `alert ${done ? 'alert-success' : 'alert-warning'} py-2`;
            let summary = `<i class="bi ${done ? 'bi-check-circle' : 'bi-exclamation-triangle'}"></i>`
                + `<strong>${mo}</strong> 抄表进度：已抄 <strong>${c.read}</strong> / ${c.total} 间`;
            if (c.unfinished > 0) summary += ` · 未完成 <strong>${c.unfinished}</strong>`;
            if (c.uncovered > 0) summary += ` · 未覆盖 <strong>${c.uncovered}</strong> 间：${c.uncoveredList.join('、')}`;
            else if ((c.read + c.unfinished) >= c.total) summary += ' · 全部完成 ✓';
            box.innerHTML = summary;
        }

        // v2.11.4：删除抄表记录（仅 status=0 未完成状态可删除）
        function deleteRecord(id, dormCode) {
            if (!confirm(`确定要删除 ${dormCode} 的未完成占位记录吗？\n删除后系统将在每日0点自动重新生成占位记录。`)) return;
            // 原型演示：实际将 DELETE /api/meter/records/{id}
            alert(`✓ 原型演示：记录 ${id}（${dormCode}）已删除\n（实际将 DELETE /api/meter/records/${id}）\n系统将在下次定时任务（每日0点）重新生成占位记录`);
            // 模拟删除效果
            const idx = METER_RECORDS.findIndex(m => m.id === id);
            if (idx >= 0) METER_RECORDS.splice(idx, 1);
            render();
        }

        function exportExcel() { alert('原型演示：实际将下载 抄表记录_' + (monthSel.value || '全部') + '.xlsx'); }

        // ========== v2.12.36 手动补录 模态弹窗逻辑 ==========
        // 弹窗显示时初始化
        document.getElementById('modalManualEntry').addEventListener('show.bs.modal', function () {
            // 初始化宿舍下拉（仅启用）
            const dormSel = document.getElementById('me_dorm');
            dormSel.innerHTML = '<option value="">请选择宿舍</option>';
            if (typeof DORMS !== 'undefined') {
                DORMS.filter(d => d.isActive).forEach(d => dormSel.innerHTML += `<option value="${d.dormCode}">${d.dormCode} | ${d.address || ''}</option>`);
            }
            // v2.12.36：抄表月份默认为服务端当前月份
            document.getElementById('me_month').value = new Date().toISOString().slice(0, 7);
            document.getElementById('me_operator').value = 'admin（后台补录）';
            // 清空输入
            ['me_cold','me_hot','me_electric'].forEach(id => { document.getElementById(id).value = ''; });
            document.getElementById('me_remark').value = '';
            document.getElementById('me_dupWarn').style.display = 'none';
            document.getElementById('me_lastRef').style.display = 'none';
            onMeterReading();
        });

        function meCurrentPrev() {
            const code = document.getElementById('me_dorm').value;
            const mo = document.getElementById('me_month').value;
            if (!code || !mo || typeof prevMeter === 'undefined') return null;
            return prevMeter(code, mo);
        }

        function meExistingRecord() {
            const code = document.getElementById('me_dorm').value;
            const mo = document.getElementById('me_month').value;
            if (!code || !mo || typeof METER_RECORDS === 'undefined') return null;
            return METER_RECORDS.find(m => m.dormCode === code && m.readMonth === mo && (m.status === 1 || m.status === 2));
        }

        function meOverwriteableRecord() {
            const code = document.getElementById('me_dorm').value;
            const mo = document.getElementById('me_month').value;
            if (!code || !mo || typeof METER_RECORDS === 'undefined') return null;
            return METER_RECORDS.find(m => m.dormCode === code && m.readMonth === mo && m.status === 0);
        }

        // 宿舍/月份变更时检测
        ['me_dorm','me_month'].forEach(id => {
            document.getElementById(id).addEventListener('change', meOnDormMonthChange);
        });
        function meOnDormMonthChange() {
            const dupWarn = document.getElementById('me_dupWarn');
            const lastRef = document.getElementById('me_lastRef');
            const exist = meExistingRecord();
            if (exist) {
                dupWarn.style.display = 'block';
                dupWarn.className = 'alert alert-warning mt-2 mb-0 py-1';
                dupWarn.style.fontSize = '0.85rem';
                dupWarn.innerHTML = `⚠️ 该宿舍 <strong>${exist.readMonth}</strong> 已有抄表记录（状态：${METER_STATUS[exist.status]}）。如需修改请到列表中「修正」，不可重复补录。`;
            } else {
                const overwriteRec = meOverwriteableRecord();
                if (overwriteRec) {
                    dupWarn.style.display = 'block';
                    dupWarn.className = 'alert alert-info mt-2 mb-0 py-1';
                    dupWarn.style.fontSize = '0.85rem';
                    dupWarn.innerHTML = `ℹ️ 该宿舍本月为 <strong>未完成</strong> 状态。提交后将覆盖此占位记录，旧数据保留到备注历史。`;
                } else {
                    dupWarn.style.display = 'none';
                }
            }
            const prev = meCurrentPrev();
            if (prev) {
                lastRef.style.display = 'block';
                lastRef.innerHTML = `📄 上月读数（${prev.readMonth}）：冷水 <strong>${prev.coldMeter}</strong> · 热水 <strong>${prev.hotMeter}</strong> · 电表 <strong>${prev.electricMeter}</strong>`;
            } else {
                lastRef.style.display = 'none';
            }
            onMeterReading();
        }

        // 三表读数变更时实时预览用量
        function onMeterReading() {
            const prev = meCurrentPrev();
            const preview = document.getElementById('me_usagePreview');
            const cold = parseFloat(document.getElementById('me_cold').value);
            const hot = parseFloat(document.getElementById('me_hot').value);
            const elec = parseFloat(document.getElementById('me_electric').value);
            // 各表用量提示
            [['me_cold','me_hint_cold','cold','冷水'],
             ['me_hot','me_hint_hot','hot','热水'],
             ['me_electric','me_hint_electric','electric','电']
            ].forEach(([inpId, hintId, key, label]) => {
                const v = parseFloat(document.getElementById(inpId).value);
                const hint = document.getElementById(hintId);
                const prevVal = prev ? prev[key === 'cold' ? 'coldMeter' : key === 'hot' ? 'hotMeter' : 'electricMeter'] : null;
                if (isNaN(v)) { hint.innerHTML = '用量：—'; hint.className = 'text-muted d-block'; return; }
                if (prevVal === null) {
                    hint.innerHTML = `<span class="text-muted">首次抄表（无上月读数）</span>`;
                } else {
                    const usage = +(v - prevVal).toFixed(2);
                    if (v <= prevVal) {
                        hint.innerHTML = `<span class="text-danger">✗ 必须大于上月 ${prevVal}</span>`;
                    } else {
                        hint.innerHTML = `<span class="text-success">用量 +${usage}${key === 'electric' ? ' 度' : ' m³'}</span>`;
                    }
                }
            });
            // 合计预览
            if (!isNaN(cold) || !isNaN(hot) || !isNaN(elec)) {
                preview.innerHTML = '<strong><i class="bi bi-calculator"></i> 本月用量预览</strong>' +
                    '<div class="d-flex gap-3 mt-1">' +
                    '<span>冷水 <strong>' + (isNaN(cold) ? '—' : cold.toFixed(2)) + '</strong> m³</span>' +
                    '<span>热水 <strong>' + (isNaN(hot) ? '—' : hot.toFixed(2)) + '</strong> m³</span>' +
                    '<span>电 <strong>' + (isNaN(elec) ? '—' : elec.toFixed(2)) + '</strong> 度</span>' +
                    '</div>';
            } else {
                preview.innerHTML = '<strong><i class="bi bi-calculator"></i> 本月用量预览</strong><p class="text-muted small mb-0 mt-1">请选择宿舍与月份，并录入读数</p>';
            }
        }

        // 提交
        function meSubmit() {
            const code = document.getElementById('me_dorm').value;
            const mo = document.getElementById('me_month').value;
            if (!code) { alert('请选择宿舍'); return; }
            if (!mo) { alert('请选择抄表月份'); return; }
            if (meExistingRecord()) { alert('该宿舍本月已有正常/已修正记录，如需修改请走修正流程'); return; }
            const prev = meCurrentPrev();
            const vals = {};
            for (const [inpId, key, label] of [['me_cold','cold','冷水'],['me_hot','hot','热水'],['me_electric','electric','电']]) {
                const v = parseFloat(document.getElementById(inpId).value);
                if (isNaN(v)) { alert(`请录入${label}读数`); return; }
                const prevVal = prev ? prev[key === 'cold' ? 'coldMeter' : key === 'hot' ? 'hotMeter' : 'electricMeter'] : null;
                if (prevVal !== null && v <= prevVal) { alert(`${label}读数必须大于上月（${prevVal}）`); return; }
                vals[key] = v;
            }
            alert(`✓ 原型演示：${code}（${mo}）抄表已补录\n冷水 ${vals.cold} / 热水 ${vals.hot} / 电表 ${vals.electric}`);
            bootstrap.Modal.getInstance(document.getElementById('modalManualEntry')).hide();
            render();
        }

        render();
    </script>
    <script src="../_shared/storage-keys.js"></script>
<script src="../_shared/tab-bar.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', function() {
            mountTabBar({ basePath: '..', currentUrl: 'meter/index.html' });
        });
    </script>
    <!-- 筛选条件持久化（v2.12.10 新增） -->
    <script src="../_shared/filter-persistence.js"></script>
</body>
